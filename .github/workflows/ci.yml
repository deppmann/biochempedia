# CI gate. Cloudflare Workers Builds deploys straight from main regardless of
# this workflow's result — CI cannot block a deploy, it can only tell you a
# push was broken. Treat a red run on main as "production is likely broken"
# and fix forward immediately.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The brand/ submodule (pinned, detached) carries the design tokens;
          # without it the build fails to resolve the shared CSS.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # astro check && validate-mcat && astro build (which also runs Pagefind and the
      # Markdown lesson copies) && check-assets (local refs + webfont gate)
      - run: npm run build
      # Answer keys must not be exploitably biased toward one letter.
      - run: node scripts/check-quiz.mjs
      # Draft lessons must not generate public routes or sitemap entries.
      - run: node scripts/check-drafts.mjs
      - run: node scripts/check-figures.mjs
      # Scoped CSS must never target elements a component builds at runtime.
      - run: node scripts/check-scoped-styles.mjs
      - run: node scripts/check-flashcards.mjs
      - run: node scripts/check-listen.mjs
      # "Before this / After this / Elsewhere" links and search phrases: every link resolves and passes the rules.
      - run: node scripts/check-lesson-links.mjs
      # Lesson search against the index this build just wrote (needs Node 22.18+ to import the .ts file).
      - run: node scripts/test-search.mjs
      # Curiosity router, offline (node:sqlite needs no flag from Node 22.13).
      - run: node scripts/test-curious.mjs
      # Study planner, offline: limits, caps, validation, saving, re-planning, teacher lists.
      - run: node scripts/test-planner.mjs
      # Learner sync: the merge rules, then two devices through the worker against the real migrations.
      - run: node scripts/test-learner-merge.mjs
      - run: node scripts/test-learner-sync.mjs
