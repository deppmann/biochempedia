# Pagefind: the full-text index for lesson search. Run by `npm run build` after `astro build`.
# See docs/expansion/mission-2026-10/FULLTEXT_SEARCH.md.
site: dist
# Only pages with data-pagefind-body are indexed (the lesson prose column in
# src/pages/lessons/[...slug].astro). These are skipped inside it: the worked answers
# folded under each "Design problem", and the box where a student types their own answer.
exclude_selectors:
  - "details"
  - ".design-answer"
